---

- name: Import a key for postgres (x86_64)
  become: true
  ansible.builtin.rpm_key:
    state: present
    key:  https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-RHEL
  when: ansible_facts.get('architecture') is search("x86_64")

- name: Import a key for postgres (aarch64)
  become: true
  ansible.builtin.rpm_key:
    state: present
    key: https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-AARCH64-RHEL
  when: ansible_facts.get('architecture') is search("aarch64")

- name: Postgres | setup dnf repository for arch64
  become: true
  ansible.builtin.dnf:
    update_cache: false
    name:
      https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-aarch64/pgdg-redhat-repo-latest.noarch.rpm
    state: present
  when: ansible_facts.get('architecture') is search("aarch64")

- name: Postgres | setup dnf repository for amd64
  become: true
  ansible.builtin.dnf:
    update_cache: false
    name:
      https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
    state: present
  when: ansible_facts.get('architecture') is search("x86_64")


- name: Collect PGDG repository diagnostics
  become: true
  ansible.builtin.shell: |
    echo "OS:"
    cat /etc/os-release
    echo "RPM release:"
    rpm -E '%{rhel}'
    echo "DNF releasever override:"
    cat /etc/dnf/vars/releasever 2>/dev/null || echo "(no override)"
    echo "PGDG common repository:"
    grep -A8 '^\[pgdg-common\]' /etc/yum.repos.d/pgdg-redhat-all.repo
    echo "DNF variables:"
    dnf --dump-variables 2>&1 || true
  register: pgdg_diagnostics
  changed_when: false

- name: Print PGDG repository diagnostics
  ansible.builtin.debug:
    var: pgdg_diagnostics.stdout_lines



- name: Debug PGDG repository configuration
  become: true
  ansible.builtin.shell: |
    echo "=== OS release ==="
    cat /etc/os-release
    echo "=== RPM release ==="
    rpm -E '%{rhel}'
    echo "=== DNF releasever override ==="
    cat /etc/dnf/vars/releasever 2>/dev/null || echo "(no override)"
    echo "=== PGDG common repository ==="
    grep -A8 '^\[pgdg-common\]' /etc/yum.repos.d/pgdg-redhat-all.repo
  changed_when: false

- name: Postgres | install client packages
  become: true
  ansible.builtin.dnf:
    name: >-
      postgresql{{ postgresql_version }}{{
        (postgresql_package_version | length > 0) |
        ternary('-' + postgresql_package_version, '')
      }}
    state: present
